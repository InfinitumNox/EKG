name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt-Laufzeitbibliotheken
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Host-Tests der Firmware
        run: |
          cmake -S firmware/tests -B build/fw-tests -G Ninja
          cmake --build build/fw-tests
          build/fw-tests/test_firmware
      - name: Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Firmware bauen
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S firmware -B build/firmware -G Ninja
          cmake --build build/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: ekg-firmware
          path: build/firmware/ekg.uf2
